version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=auth_backend
      - POSTGRES_USER=auth_user
      - POSTGRES_PASSWORD=auth_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_backend"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_roles_permissions --business-type=generic &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=your-secret-key-here
      - DATABASE_URL=postgresql://auth_user:auth_password@db:5432/auth_backend
      - REDIS_URL=redis://redis:6379/0
      - EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      - CORS_ALLOWED_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
      - OAUTH_GOOGLE_CLIENT_ID=your-google-client-id
      - OAUTH_GOOGLE_CLIENT_SECRET=your-google-client-secret
      - OAUTH_GOOGLE_REDIRECT_URI=http://localhost:8000/api/v1/oauth2/callback/
      - OAUTH_MICROSOFT_CLIENT_ID=your-microsoft-client-id
      - OAUTH_MICROSOFT_CLIENT_SECRET=your-microsoft-client-secret
      - OAUTH_MICROSOFT_REDIRECT_URI=http://localhost:8000/api/v1/oauth2/callback/
      - OAUTH_GITHUB_CLIENT_ID=your-github-client-id
      - OAUTH_GITHUB_CLIENT_SECRET=your-github-client-secret
      - OAUTH_GITHUB_REDIRECT_URI=http://localhost:8000/api/v1/oauth2/callback/
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build: .
    command: celery -A auth_backend worker -l info
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=your-secret-key-here
      - DATABASE_URL=postgresql://auth_user:auth_password@db:5432/auth_backend
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  celery-beat:
    build: .
    command: celery -A auth_backend beat -l info
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=your-secret-key-here
      - DATABASE_URL=postgresql://auth_user:auth_password@db:5432/auth_backend
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

