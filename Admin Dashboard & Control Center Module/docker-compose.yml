version: '3.8'

services:
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: admin_dashboard_db
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: admin_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:6-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql://admin_user:admin_password@db:5432/admin_dashboard_db
      - REDIS_URL=redis://redis:6379/0

  celery:
    build: .
    command: celery -A admin_dashboard worker -l info
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql://admin_user:admin_password@db:5432/admin_dashboard_db
      - REDIS_URL=redis://redis:6379/0

  celery-beat:
    build: .
    command: celery -A admin_dashboard beat -l info
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql://admin_user:admin_password@db:5432/admin_dashboard_db
      - REDIS_URL=redis://redis:6379/0

volumes:
  postgres_data:
